[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulauncher-gpt"
version = "0.1.0"
description = "Ulauncher plugin for OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.12.0",
  "black>=24.8.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0.20241016",
  "bandit>=1.7.9",
  "pip-audit>=2.7.0",
  "pdoc>=14.5.0"
]

[tool.pytest.ini_options]
addopts = "-q --cov=ulauncher_gpt --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["ulauncher_gpt"]
